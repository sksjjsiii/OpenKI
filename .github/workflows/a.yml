name: Build Andoco APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Clone termux-generator
        run: |
          git clone https://github.com/robertkirkman/termux-generator.git
          cd termux-generator
          chmod +x build-termux.sh

      - name: Generate Termux Source with Custom Package Name
        run: |
          cd termux-generator
          # ایجاد پوشه و کلون کردن سورس اصلی ترموکس
          mkdir -p termux-apps-main
          git clone --depth 1 https://github.com/termux/termux-app.git termux-apps-main/termux-app
          
          # اجرای اسکریپت (این اسکریپت خودش بیلد اولیه را انجام می‌دهد)
          ./build-termux.sh \
            --name com.andoco.app \
            --architectures aarch64 \
            --dirty \
            --disable-bootstrap \
            --disable-x11 \
            --disable-gui \
            --disable-api \
            --disable-boot \
            --disable-widget \
            --disable-float \
            --disable-tasker \
            --disable-styling

      - name: Inject WebView Capability
        run: |
          # استفاده از مسیر مطلق برای جلوگیری از خطای پیدا نشدن فایل
          SRC="${{ github.workspace }}/termux-generator/termux-apps-main/termux-app"
          
          # ۱. ساخت فایل WebViewActivity.java
          PKG_PATH="$SRC/app/src/main/java/com/andoco/app/webview"
          mkdir -p "$PKG_PATH"
          cat > "$PKG_PATH/WebViewActivity.java" << 'EOF'
          package com.andoco.app.webview;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class WebViewActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("http://127.0.0.1:4096");
                  setContentView(webView);
                  Toast.makeText(this, "Connecting to OpenCode...", Toast.LENGTH_SHORT).show();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # ۲. ثبت Activity در Manifest و فعال‌سازی Cleartext Traffic
          MANIFEST="$SRC/app/src/main/AndroidManifest.xml"
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST"
          sed -i 's/<\/application>/<activity android:name="com.andoco.app.webview.WebViewActivity" android:exported="true" \/>\n<\/application>/' "$MANIFEST"

          # ۳. اضافه کردن دکمه به منو
          MENU_FILE="$SRC/app/src/main/res/menu/main.xml"
          if [ -f "$MENU_FILE" ]; then
            sed -i 's/<\/menu>/<item android:id="@+id\/action_webview" android:title="OpenCode Web" android:showAsAction="never" \/>\n<\/menu>/' "$MENU_FILE"
          fi

          # ۴. تزریق کد به انتهای TermuxActivity.java (روش ایمن‌تر برای جلوگیری از خطای sed)
          ACTIVITY_FILE=$(find "$SRC" -name "TermuxActivity.java" | head -1)
          if [ -f "$ACTIVITY_FILE" ]; then
            # حذف آکولاد بسته انتهایی فایل
            sed -i '$ d' "$ACTIVITY_FILE"
            # اضافه کردن متد و بستن کلاس
            cat >> "$ACTIVITY_FILE" << 'EOF'

    @Override
    public boolean onOptionsItemSelected(android.view.MenuItem item) {
        if (item.getItemId() == R.id.action_webview) {
            startActivity(new android.content.Intent(this, com.andoco.app.webview.WebViewActivity.class));
            return true;
        }
        return super.onOptionsItemSelected(item);
    }
}
EOF
          fi

      - name: Rebuild APK with WebView
        run: |
          cd "${{ github.workspace }}/termux-generator/termux-apps-main/termux-app"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andoco-Debug-APK
          path: termux-generator/termux-apps-main/termux-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error