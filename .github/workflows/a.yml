name: Build Andoco APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Clone termux-generator
        run: |
          git clone https://github.com/robertkirkman/termux-generator.git
          cd termux-generator
          chmod +x build-termux.sh

      - name: Generate Termux Source with Custom Package Name
        run: |
          cd termux-generator
          # ایجاد پوشه و کلون کردن سورس اصلی ترموکس
          mkdir -p termux-apps-main
          git clone --depth 1 https://github.com/termux/termux-app.git termux-apps-main/termux-app
          
          # اجرای اسکریپت برای تغییر نام پکیج
          ./build-termux.sh \
            --name com.andoco.app \
            --architectures aarch64 \
            --dirty \
            --disable-bootstrap \
            --disable-x11 \
            --disable-gui \
            --disable-api \
            --disable-boot \
            --disable-widget \
            --disable-float \
            --disable-tasker \
            --disable-styling

      - name: Inject WebView Capability
        run: |
          # استفاده از مسیر مطلق
          SRC="${{ github.workspace }}/termux-generator/termux-apps-main/termux-app"
          PKG_PATH="$SRC/app/src/main/java/com/andoco/app/webview"
          mkdir -p "$PKG_PATH"
          
          # ۱. ساخت فایل WebViewActivity.java با استفاده از Base64 (برای جلوگیری از خطای YAML)
          echo '' | base64 -d > "$PKG_PATH/WebViewActivity.java"

          # ۲. ثبت Activity در Manifest و فعال‌سازی Cleartext Traffic
          MANIFEST="$SRC/app/src/main/AndroidManifest.xml"
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST"
          sed -i 's/<\/application>/<activity android:name="com.andoco.app.webview.WebViewActivity" android:exported="true" \/>\n<\/application>/' "$MANIFEST"

          # ۳. اضافه کردن دکمه به منو
          MENU_FILE="$SRC/app/src/main/res/menu/main.xml"
          if [ -f "$MENU_FILE" ]; then
            sed -i 's/<\/menu>/<item android:id="@+id\/action_webview" android:title="OpenCode Web" android:showAsAction="never" \/>\n<\/menu>/' "$MENU_FILE"
          fi

          # ۴. تزریق کد به TermuxActivity.java
          ACTIVITY_FILE=$(find "$SRC" -name "TermuxActivity.java" | head -1)
          if [ -f "$ACTIVITY_FILE" ]; then
            sed -i 's/import android.os.Bundle;/import android.os.Bundle;\nimport com.andoco.app.webview.WebViewActivity;/' "$ACTIVITY_FILE"
            
            # اگر متد onOptionsItemSelected وجود داشت، کد را داخل آن تزریق می‌کنیم
            if grep -q "onOptionsItemSelected" "$ACTIVITY_FILE"; then
              sed -i 's/public boolean onOptionsItemSelected(MenuItem item) {/public boolean onOptionsItemSelected(MenuItem item) {\n        if (item.getItemId() == R.id.action_webview) {\n            startActivity(new Intent(this, WebViewActivity.class));\n            return true;\n        }/' "$ACTIVITY_FILE"
            else
              # در غیر این صورت، آکولاد آخر را حذف کرده و متد جدید را اضافه می‌کنیم
              sed -i '$ d' "$ACTIVITY_FILE"
              echo '' | base64 -d >> "$ACTIVITY_FILE"
            fi
          fi

      - name: Rebuild APK with WebView
        run: |
          cd "${{ github.workspace }}/termux-generator/termux-apps-main/termux-app"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andoco-Debug-APK
          path: termux-generator/termux-apps-main/termux-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error