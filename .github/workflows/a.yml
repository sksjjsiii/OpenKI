name: OpenCode Web (Secure)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'مدت زمان اجرا (دقیقه)'
        required: true
        default: '60'
      opencode_port:
        description: 'پورت داخلی OpenCode Web'
        required: true
        default: '4096'
      proxy_port:
        description: 'پورت پروکسی امن (Caddy)'
        required: true
        default: '8443'

permissions:
  contents: write

concurrency:
  group: opencode-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  opencode-web:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}
      OPENCODE_BASIC_PASS: ${{ secrets.OPENCODE_BASIC_PASS }}
      OPENCODE_PORT: ${{ github.event.inputs.opencode_port }}
      PROXY_PORT: ${{ github.event.inputs.proxy_port }}
      CADDY_VERSION: '2.8.4'

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: تنظیم Git identity + مسیرهای امن
        run: |
          git config user.name  "opencode-bot"
          git config user.email "opencode-bot@users.noreply.github.com"

          LOG_DIR="${RUNNER_TEMP:-/tmp}/opencode-logs"
          mkdir -p "$LOG_DIR"
          echo "LOG_DIR=$LOG_DIR" >> "$GITHUB_ENV"

          CONFIG_ROOT="${RUNNER_TEMP:-/tmp}/opencode-config"
          mkdir -p "$CONFIG_ROOT/opencode"
          echo "XDG_CONFIG_HOME=$CONFIG_ROOT" >> "$GITHUB_ENV"

          printf '\n# === OpenCode runner artifacts (auto) ===\n*.log\nopencode-url.txt\n.opencode/\nopencode.json\n.env\n.env.*\n' >> .gitignore

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب OpenCode
        run: |
          npm install -g opencode-ai@latest || npm install -g opencode@latest
          opencode --version || true

      - name: نصب Caddy (دانلود مستقیم از GitHub Releases)
        run: |
          set -euo pipefail
          ARCH="amd64"
          URL="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_${ARCH}.tar.gz"
          echo "⬇️ دانلود Caddy از: $URL"
          curl -fsSL "$URL" -o /tmp/caddy.tar.gz
          tar -xzf /tmp/caddy.tar.gz -C /tmp caddy
          sudo install -m 0755 /tmp/caddy /usr/local/bin/caddy
          rm -f /tmp/caddy /tmp/caddy.tar.gz
          caddy version

      - name: ساخت کانفیگ OpenCode
        run: |
          set -euo pipefail
          CONFIG_FILE="$XDG_CONFIG_HOME/opencode/opencode.json"

          PASS_HASH=$(caddy hash-password --plaintext "$OPENCODE_BASIC_PASS")
          echo "CADDY_PASS_HASH=$PASS_HASH" >> "$GITHUB_ENV"

          cat > "$CONFIG_FILE" <<'JSONEOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "pollinations": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Pollinations (OpenAI-compatible)",
                "options": {
                  "baseURL": "https://gen.pollinations.ai/v1",
                  "apiKey": "PLACEHOLDER_KEY"
                },
                "models": {
                  "stealth/glyph-cluster": {
                    "name": "stealth/glyph-cluster"
                  }
                }
              }
            },
            "model": "pollinations/stealth/glyph-cluster",
            "autoupdate": false,
            "share": "disabled"
          }
          JSONEOF

          python3 - "$CONFIG_FILE" <<'PY'
          import sys, os
          p = sys.argv[1]
          s = open(p).read()
          s = s.replace("PLACEHOLDER_KEY", os.environ["POLLINATIONS_API_KEY"])
          open(p, "w").write(s)
          PY

          chmod 600 "$CONFIG_FILE"
          echo "✅ کانفیگ ساخته شد: $CONFIG_FILE"

      - name: اجرای OpenCode Web
        run: |
          set -euo pipefail
          nohup opencode web --port "$OPENCODE_PORT" --hostname 127.0.0.1 > "$LOG_DIR/opencode.log" 2>&1 &
          echo "OPENCODE_PID=$!" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 "http://127.0.0.1:$OPENCODE_PORT" || echo "000")
            if echo "$CODE" | grep -qE '200|30[0-9]|40[0-9]'; then
              echo "✅ OpenCode Web آماده است (HTTP $CODE)"
              break
            fi
            echo "⏳ انتظار... ($i/30) - کد: $CODE"
            sleep 2
          done
          tail -n 40 "$LOG_DIR/opencode.log" || true

      - name: راه‌اندازی Caddy
        run: |
          set -euo pipefail
          CADDY_DIR="${RUNNER_TEMP:-/tmp}/caddy"
          mkdir -p "$CADDY_DIR"

          cat > "$CADDY_DIR/Caddyfile" <<'CADDYEOF'
          {
            admin off
            auto_https off
          }

          :__PROXY_PORT__ {
            encode zstd gzip

            basic_auth {
              __BASIC_USER__ __BASIC_HASH__
            }

            header {
              Strict-Transport-Security "max-age=31536000; includeSubDomains"
              X-Content-Type-Options "nosniff"
              X-Frame-Options "DENY"
              Referrer-Policy "no-referrer"
              -Server
            }

            reverse_proxy 127.0.0.1:__OPENCODE_PORT__ {
              header_up Host {host}
              header_up X-Real-IP {remote_host}
            }
          }
          CADDYEOF

          python3 - "$CADDY_DIR/Caddyfile" <<'PY'
          import sys, os
          p = sys.argv[1]
          s = open(p).read()
          s = s.replace("__PROXY_PORT__", os.environ["PROXY_PORT"])
          s = s.replace("__OPENCODE_PORT__", os.environ["OPENCODE_PORT"])
          s = s.replace("__BASIC_USER__", os.environ["OPENCODE_BASIC_USER"])
          s = s.replace("__BASIC_HASH__", os.environ["CADDY_PASS_HASH"])
          open(p, "w").write(s)
          PY

          echo "----- Caddyfile نهایی -----"
          cat "$CADDY_DIR/Caddyfile"
          echo "---------------------------"

          caddy validate --config "$CADDY_DIR/Caddyfile" --adapter caddyfile

          nohup caddy run --config "$CADDY_DIR/Caddyfile" --adapter caddyfile > "$LOG_DIR/caddy.log" 2>&1 &
          echo "CADDY_PID=$!" >> "$GITHUB_ENV"

          sleep 5
          tail -n 30 "$LOG_DIR/caddy.log" || true

          NOAUTH=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${PROXY_PORT}/" || echo "000")
          echo "بدون رمز → HTTP $NOAUTH (باید 401 باشد)"
          if [ "$NOAUTH" != "401" ]; then
            echo "❌ Basic Auth کار نمی‌کند"
            exit 1
          fi

          AUTH=$(curl -s -o /dev/null -w "%{http_code}" -u "${OPENCODE_BASIC_USER}:${OPENCODE_BASIC_PASS}" "http://127.0.0.1:${PROXY_PORT}/" || echo "000")
          echo "با رمز → HTTP $AUTH (نباید 401 باشد)"
          if [ "$AUTH" = "401" ]; then
            echo "❌ رمز درست پذیرفته نمی‌شود"
            exit 1
          fi
          echo "✅ Basic Auth فعال است"

      - name: راه‌اندازی تونل Cloudflare
        run: |
          set -euo pipefail
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          nohup ./cloudflared tunnel --url "http://127.0.0.1:${PROXY_PORT}" --no-autoupdate > "$LOG_DIR/cloudflare.log" 2>&1 &
          echo "CLOUDFLARED_PID=$!" >> "$GITHUB_ENV"

          sleep 8
          TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' "$LOG_DIR/cloudflare.log" | head -n1 || true)
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ خطا در ساخت تونل"
            cat "$LOG_DIR/cloudflare.log"
            exit 1
          fi
          echo "✅ تونل: $TUNNEL_URL"
          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"
          echo "$TUNNEL_URL" > opencode-url.txt

      - name: نمایش خلاصه
        run: |
          {
            echo "## OpenCode Web (Secure) 🔐"
            echo ""
            echo "- **URL:** ${{ env.TUNNEL_URL }}"
            echo "- **Username:** (از Secrets → OPENCODE_BASIC_USER)"
            echo "- **Password:** (از Secrets → OPENCODE_BASIC_PASS)"
            echo "- **Model:** \`stealth/glyph-cluster\`"
            echo "- **Base URL:** \`https://gen.pollinations.ai/v1\`"
            echo "- **مدت:** ${{ github.event.inputs.duration }} دقیقه"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: نگهبانی سرویس‌ها
        run: |
          set -uo pipefail
          DURATION="${{ github.event.inputs.duration }}"
          END_TIME=$(date -d "$DURATION minutes" +%s)
          TUNNEL_URL="${{ env.TUNNEL_URL }}"
          CADDY_CFG="${RUNNER_TEMP:-/tmp}/caddy/Caddyfile"

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            REMAINING=$((END_TIME - $(date +%s)))
            echo "[$(date +%H:%M:%S)] باقی‌مانده: $((REMAINING/60))m $((REMAINING%60))s"

            OC=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "http://127.0.0.1:${OPENCODE_PORT}" || echo "000")
            if [ "$OC" = "000" ]; then
              echo "⚠️ OpenCode پاسخ نمی‌دهد - ری‌استارت..."
              pkill -f "opencode web" || true
              sleep 2
              nohup opencode web --port "$OPENCODE_PORT" --hostname 127.0.0.1 > "$LOG_DIR/opencode.log" 2>&1 &
              sleep 5
            fi

            CAD=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${PROXY_PORT}/" || echo "000")
            if [ "$CAD" != "401" ]; then
              echo "⚠️ Caddy مشکل دارد (HTTP $CAD) - ری‌استارت..."
              pkill -f caddy || true
              sleep 2
              nohup caddy run --config "$CADDY_CFG" --adapter caddyfile > "$LOG_DIR/caddy.log" 2>&1 &
              sleep 5
            fi

            T=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "$TUNNEL_URL" || echo "000")
            if [ "$T" = "000" ] || [ "$T" = "502" ] || [ "$T" = "530" ]; then
              echo "⚠️ تونل مشکل دارد (HTTP $T) - بازسازی..."
              pkill -f cloudflared || true
              sleep 2
              nohup ./cloudflared tunnel --url "http://127.0.0.1:${PROXY_PORT}" --no-autoupdate > "$LOG_DIR/cloudflare.log" 2>&1 &
              sleep 8
              NEW=$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' "$LOG_DIR/cloudflare.log" | head -n1 || true)
              if [ -n "$NEW" ]; then
                TUNNEL_URL="$NEW"
                echo "$NEW" > opencode-url.txt
                echo "🔄 آدرس جدید: $NEW"
              fi
            fi

            sleep 30
          done

      - name: آپلود آرتیفکت
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-secure-info
          path: |
            ${{ env.LOG_DIR }}/*.log
            opencode-url.txt
          if-no-files-found: ignore

      - name: Commit و push اجباری
        if: always()
        run: |
          set -uo pipefail
          git add -A

          if git diff --cached -U0 | grep -aiE '(api[_-]?key|secret|token|password|Bearer)[=:" ]+[A-Za-z0-9_\-]{16,}'; then
            echo "❌ الگوی مشکوک به Secret در تغییرات پیدا شد — commit لغو شد"
            git reset
            exit 1
          fi

          if git diff --cached --name-only | grep -aiE '(^|/)(\.env|opencode\.json|.*\.log)$|\.opencode/'; then
            echo "❌ فایل حساس در staging — commit لغو شد"
            git reset
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "ℹ️ تغییری برای commit وجود ندارد"
            exit 0
          fi

          git commit -m "chore(opencode): auto-commit at $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "✅ push موفق (تلاش $attempt)"
              exit 0
            fi
            echo "⚠️ push ناموفق، تلاش $attempt — rebase و مجدد..."
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            sleep 3
          done
          echo "❌ push در ۳ تلاش ناموفق بود"
          exit 1