name: Build Andoco APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. چک‌اوت مخزن
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. کپی موقت فایل WebViewActivity.java به خارج از مخزن
      - name: Backup WebViewActivity
        run: |
          mkdir -p /tmp/backup
          if [ -f "source/WebViewActivity.java" ]; then
            cp source/WebViewActivity.java /tmp/backup/WebViewActivity.java
          fi

      # 3. پاکسازی مخزن (به جز .github و .git)
      - name: Clean repository (keep only .github and .git)
        run: |
          find . -maxdepth 1 \
            -not -name '.github' \
            -not -name '.git' \
            -not -name '.' \
            -exec rm -rf {} +
          ls -la

      # 4. نصب پیش‌نیازها
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      # 5. دانلود و آماده‌سازی سورس ترموکس
      - name: Clone termux-generator
        run: |
          git clone https://github.com/robertkirkman/termux-generator.git
          cd termux-generator
          chmod +x build-termux.sh

      - name: Generate Termux Source with Custom Package Name
        run: |
          cd termux-generator
          mkdir -p termux-apps-main
          git clone --depth 1 https://github.com/termux/termux-app.git termux-apps-main/termux-app
          ./build-termux.sh \
            --name com.andoco.app \
            --architectures aarch64 \
            --dirty \
            --disable-bootstrap \
            --disable-x11 \
            --disable-gui \
            --disable-api \
            --disable-boot \
            --disable-widget \
            --disable-float \
            --disable-tasker \
            --disable-styling

      # 6. تزریق قابلیت وب‌ویو
      - name: Inject WebView Capability
        run: |
          SRC="${{ github.workspace }}/termux-generator/termux-apps-main/termux-app"
          PKG_PATH="$SRC/app/src/main/java/com/andoco/app/webview"
          mkdir -p "$PKG_PATH"

          # کپی فایل WebViewActivity.java
          if [ -f "/tmp/backup/WebViewActivity.java" ]; then
            cp /tmp/backup/WebViewActivity.java "$PKG_PATH/WebViewActivity.java"
          fi

          # بازنویسی فایل network_security_config.xml
          XML_FILE="$SRC/app/src/main/res/xml/network_security_config.xml"
          if [ -f "$XML_FILE" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?>' > "$XML_FILE"
            echo '<network-security-config>' >> "$XML_FILE"
            echo '    <base-config cleartextTrafficPermitted="true" />' >> "$XML_FILE"
            echo '    <domain-config cleartextTrafficPermitted="true">' >> "$XML_FILE"
            echo '        <domain includeSubdomains="true">127.0.0.1</domain>' >> "$XML_FILE"
            echo '        <domain includeSubdomains="true">localhost</domain>' >> "$XML_FILE"
            echo '    </domain-config>' >> "$XML_FILE"
            echo '</network-security-config>' >> "$XML_FILE"
          fi

          # تزریق به Manifest
          MANIFEST="$SRC/app/src/main/AndroidManifest.xml"
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST"
          sed -i 's/<\/application>/<activity android:name="com.andoco.app.webview.WebViewActivity" android:exported="true" android:theme="@android:style\/Theme.NoTitleBar.Fullscreen" \/>\n<\/application>/' "$MANIFEST"

          # تزریق کد به TermuxActivity.java
          ACTIVITY_FILE="$SRC/app/src/main/java/com/termux/app/TermuxActivity.java"
          sed -i 's/import android.os.Bundle;/import android.os.Bundle;\nimport com.andoco.app.webview.WebViewActivity;/' "$ACTIVITY_FILE"
          sed -i 's/private static final int CONTEXT_MENU_REPORT_ID = 9;/private static final int CONTEXT_MENU_REPORT_ID = 9;\n    private static final int CONTEXT_MENU_OPENCODE_WEB_ID = 12;/' "$ACTIVITY_FILE"
          sed -i 's/menu.add(Menu.NONE, CONTEXT_MENU_REPORT_ID, Menu.NONE, R.string.action_report_issue);/menu.add(Menu.NONE, CONTEXT_MENU_REPORT_ID, Menu.NONE, R.string.action_report_issue);\n        menu.add(Menu.NONE, CONTEXT_MENU_OPENCODE_WEB_ID, Menu.NONE, "OpenCode Web");/' "$ACTIVITY_FILE"
          sed -i 's/case CONTEXT_MENU_REPORT_ID:/case CONTEXT_MENU_OPENCODE_WEB_ID:\n                startActivity(new Intent(this, WebViewActivity.class));\n                return true;\n            case CONTEXT_MENU_REPORT_ID:/' "$ACTIVITY_FILE"

      # 7. بیلد APK
      - name: Rebuild APK with WebView
        run: |
          cd "${{ github.workspace }}/termux-generator/termux-apps-main/termux-app"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      # 8. کپی سورس به پوشه source و پوش به مخزن
      - name: Save Source to Repository and Push
        run: |
          mkdir -p source

          if [ -f "/tmp/backup/WebViewActivity.java" ]; then
            cp /tmp/backup/WebViewActivity.java source/WebViewActivity.java
          fi

          cp -r termux-generator/termux-apps-main/termux-app/* source/

          # پیکربندی گیت
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          git commit -m "Auto-save updated Termux source with WebView [skip ci]" || echo "No changes to commit"
          
          # اطمینان از اتصال به ریموت
          git remote -v
          git push origin HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. آپلود فایل APK به عنوان آرتیفکت
      - name: Upload Specific APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andoco-APK
          path: 'termux-generator/termux-apps-main/termux-app/app/build/outputs/apk/debug/termux-app_apt-android-7-debug_arm64-v8a.apk'
          archive: false
          if-no-files-found: error