name: Build Andoco APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Clone termux-generator
        run: |
          git clone https://github.com/robertkirkman/termux-generator.git
          cd termux-generator
          chmod +x build-termux.sh

      - name: Generate Termux Source with Custom Package Name
        run: |
          cd termux-generator
          mkdir -p termux-apps-main
          git clone --depth 1 https://github.com/termux/termux-app.git termux-apps-main/termux-app
          ./build-termux.sh \
            --name com.andoco.app \
            --architectures aarch64 \
            --dirty \
            --disable-bootstrap \
            --disable-x11 \
            --disable-gui \
            --disable-api \
            --disable-boot \
            --disable-widget \
            --disable-float \
            --disable-tasker \
            --disable-styling

      - name: Inject WebView Capability
        run: |
          SRC="${{ github.workspace }}/termux-generator/termux-apps-main/termux-app"
          PKG_PATH="$SRC/app/src/main/java/com/andoco/app/webview"
          mkdir -p "$PKG_PATH"
          
          # 1. کپی فایل WebViewActivity.java
          cp "${{ github.workspace }}/source/WebViewActivity.java" "$PKG_PATH/WebViewActivity.java"

          # 2. ثبت Activity در Manifest
          MANIFEST="$SRC/app/src/main/AndroidManifest.xml"
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST"
          sed -i 's/<\/application>/<activity android:name="com.andoco.app.webview.WebViewActivity" android:exported="true" android:theme="@android:style\/Theme.NoTitleBar.Fullscreen" \/>\n<\/application>/' "$MANIFEST"

          # 3. تزریق کد به TermuxActivity.java
          ACTIVITY_FILE="$SRC/app/src/main/java/com/termux/app/TermuxActivity.java"

          # 3.1. اضافه کردن import
          sed -i 's/import android.os.Bundle;/import android.os.Bundle;\nimport com.andoco.app.webview.WebViewActivity;/' "$ACTIVITY_FILE"

          # 3.2. تعریف شناسه جدید برای آیتم منو
          sed -i 's/private static final int CONTEXT_MENU_REPORT_ID = 9;/private static final int CONTEXT_MENU_REPORT_ID = 9;\n    private static final int CONTEXT_MENU_OPENCODE_WEB_ID = 12;/' "$ACTIVITY_FILE"

          # 3.3. اضافه کردن آیتم به منوی زمینه (onCreateContextMenu)
          # این کار آیتم را در انتهای منو اضافه می‌کند
          sed -i 's/menu.add(Menu.NONE, CONTEXT_MENU_REPORT_ID, Menu.NONE, R.string.action_report_issue);/menu.add(Menu.NONE, CONTEXT_MENU_REPORT_ID, Menu.NONE, R.string.action_report_issue);\n        menu.add(Menu.NONE, CONTEXT_MENU_OPENCODE_WEB_ID, Menu.NONE, "OpenCode Web");/' "$ACTIVITY_FILE"

          # 3.4. مدیریت کلیک روی آیتم جدید (onContextItemSelected)
          # این کد را بعد از case مربوط به REPORT_ID اضافه می‌کنیم
          sed -i 's/case CONTEXT_MENU_REPORT_ID:/case CONTEXT_MENU_REPORT_ID:/' "$ACTIVITY_FILE" # فقط برای اطمینان از وجود
          sed -i '/case CONTEXT_MENU_REPORT_ID:/a \ \ \ \ \ \ \ \ \ \ \ \ case CONTEXT_MENU_OPENCODE_WEB_ID:\n                startActivity(new Intent(this, WebViewActivity.class));\n                return true;' "$ACTIVITY_FILE"


      - name: Rebuild APK with WebView
        run: |
          cd "${{ github.workspace }}/termux-generator/termux-apps-main/termux-app"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andoco-Debug-APK
          path: termux-generator/termux-apps-main/termux-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error